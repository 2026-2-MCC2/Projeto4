<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar - TrocaTicket</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="../index.html"> <img src="../../../../images/logo_navbar_web.png" alt="TrocaTicket"> </a>
    </header>
    <main>
        <section>
            <h1>Entrar</h1>
            <p>Acesse sua conta TrocaTicket.</p>
            <form>
                <div>
                    <label for="email"> E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>
                <div>
                    <label for="senha"> Senha </label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha"  required >
                </div>
                <button type="submit"> Entrar </button>
            </form>
            <p> <a href=""> Esqueci minha senha </a> </p>
            <p>
                Ainda não possui uma conta?
                <a href="cadastro.html"> Criar conta </a>
            </p>
            <p>
                É administrador?
                <a href="admin/login.html"> Entrar como admin </a>
            </p>
        </section>
    </main>
    <footer>
        <p> &copy; 2026 TrocaTicket. Todos os direitos reservados.</p>
        <p> Site desenvolvido por <a href="https://www.linkedin.com/in/alanas-rocha/">Alana</a>, <a href="https://github.com/BrunaClara">Bruna</a>, <a href="www.linkedin.com/in/geovanna-tamagusko">Geovanna</a> e <a href="https://github.com/juliaandmed">Julia</a>.</p>
    </footer>
</body>
</html>
