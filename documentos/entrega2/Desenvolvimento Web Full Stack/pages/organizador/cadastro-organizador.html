<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Organizador | TrocaTicket</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <div class="auth">
    <main class="auth-card">
      <div class="auth-brand">
        <img src="../../images/logo_navbar_web.png" alt="TrocaTicket">
        <h1>Cadastro Organizador</h1>
        <p>Gerencie as vendas, controle os acessos e valide ingressos com total segurança e transparência criptográfica.
        </p>
      </div>
      <form action="dashboard.html">
        <div class="form-grid">
          <div class="field">
            <label for="nome">Nome Completo</label><input id="nome" required placeholder="Ex: Mariana Silva">
          </div>
          <div class="field">
            <label for="doc">CNPJ / CPF</label><input id="doc" required
              placeholder="00.000.000/0001-00 ou 000.000.000-00">
          </div>
          <div class="field">
            <label for="email">E-mail Organizador</label><input type="email" id="email" required
              placeholder="seu@empresa.com">
          </div>
          <div class="field">
            <label for="telefone">Telefone / WhatsApp</label><input id="telefone" required
              placeholder="(11) 98765-4321">
          </div>
          <div class="field full">
            <label for="endereco">Endereço da Sede</label><input id="endereco" required
              placeholder="Ex: Av. Paulista, 1000 - São Paulo, SP">
          </div>
          <div class="field full">
            <label for="tipo">Tipo de Eventos</label>
            <select id="tipo" required>
              <option value="">Selecione a categoria principal</option>
              <option>Shows</option>
              <option>Festivais</option>
              <option>Esportes</option>
              <option>Teatro</option>
              <option>Corporativo</option>
              <option>Outros</option>
            </select>
          </div>
          <div class="field">
            <label for="senha">Senha</label><input type="password" id="senha" minlength="8" required
              placeholder="Mínimo 8 caracteres">
            <span class="hint">Força: Forte (combinação de letras e números)</span>
          </div>
          <div class="field">
            <label for="confirmar">Confirmar Senha</label><input type="password" id="confirmar" minlength="8" required
              placeholder="Repita sua senha">
          </div>
        </div>
        <label class="check"><input type="checkbox" required>
          <span>Li e concordo com os Termos de Uso e a Política de Privacidade do TrocaTicket.</span>
        </label>
        <button class="btn btn-primary" style="width:100%;margin-top:18px">CADASTRAR</button>
      </form>
      <div class="auth-footer">Já possui uma conta? <a href="../login.html">Fazer login</a></div>
      <div class="auth-footer">Transações Protegidas · Taxa Zero no 1º Repasse</div>
    </main>
  </div>
</body>

</html>
