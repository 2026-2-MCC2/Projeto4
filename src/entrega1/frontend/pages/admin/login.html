<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Administrador - TrocaTicket</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <header>
        <a href="../../index.html">
            <img src="../../../../../images/logo_navbar_web.png" alt="TrocaTicket">
        </a>
    </header>

    <main>
        <section class="admin-card">
            <span class="admin-badge">ADMIN</span>
            <h1>Painel Administrativo</h1>
            <p>Acesso restrito à equipe TrocaTicket.</p>

            <form>
                <div>
                    <label for="email">E-mail corporativo</label>
                    <input type="email" id="email" name="email" value="admin@trocaticket.com.br" required>
                </div>
                <div>
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>
                <a href="dashboard.html" class="admin-login-btn">Entrar no painel</a>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 TrocaTicket. Ambiente interno — acesso restrito.</p>
    </footer>
</body>
</html>
