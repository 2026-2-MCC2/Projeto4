<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Serviço - Fornecedor</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Troca<span>Ticket</span></div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="busca.html">Buscar Eventos</a>
            <a href="propostas.html">Minhas Propostas</a>
            <a href="eventos.html">Meus Eventos</a>
            <a href="fornecedores.html">Meu Perfil</a>
            <a href="../login.html">Sair</a>
        </nav>
    </header>

    <main>
        <div class="form-card">
            <h1>Cadastrar Serviço</h1>
            <p>Preencha os dados abaixo para anunciar seu serviço aos organizadores de eventos na plataforma.</p>

            <form>
                <div class="field">
                    <label for="empresa">Nome da empresa</label>
                    <input type="text" id="empresa" name="empresa" required>
                </div>

                <div class="field">
                    <label for="responsavel">Responsável</label>
                    <input type="text" id="responsavel" name="responsavel" required>
                </div>

                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="field">
                    <label for="telefone">Telefone / WhatsApp</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(11) 98765-4321" required>
                </div>

                <div class="field">
                    <label for="servico">Serviço ou produto</label>
                    <input type="text" id="servico" name="servico" required>
                </div>

                <div class="field">
                    <label for="valor">Valor</label>
                    <input type="number" id="valor" name="valor" step="0.01" min="0" required>
                </div>

                <button type="submit">Cadastrar Serviço</button>
            </form>
        </div>
    </main>

</body>
</html>
